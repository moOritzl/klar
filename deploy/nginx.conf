server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Caching. Nothing here is content-hashed, because the site has no build
    # step, so a long max-age on the stylesheet or the script would serve
    # visitors a stale page after every deploy. "no-cache" does not mean "do
    # not store": the browser keeps the file and revalidates, so a repeat
    # visit costs a 304 of a few hundred bytes. On a page this size that is
    # the right trade for never shipping a stale mix of old CSS and new HTML.
    location = / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
        try_files /index.html =404;
    }

    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Images and fonts change rarely and are renamed when they do.
    location ~* \.(?:svg|webp|png|jpg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ =404;
    }

    gzip              on;
    gzip_types        text/css application/javascript image/svg+xml;
    gzip_min_length   512;

    # webp and woff2 are already compressed; gzipping them wastes CPU.
    error_page  404  /index.html;
}
